syntax = "proto3";
package com.seezoon.stub.greeter;
option java_package = "com.seezoon.stub.greeter";
option java_outer_classname = "GreeterPb";
option java_multiple_files = false;

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
