# mybatis
mybatis:
  mapper-locations: classpath*:mappings/**/*.xml
spring:
  datasource:
    url: jdbc:mysql://${datasource.meta.host}:${datasource.meta.port}/seezoon?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&connectTimeout=1000&socketTimeout=60000&rewriteBatchedStatements=true&allowMultiQueries=true
    username: ${datasource.meta.username}
    password: ${datasource.meta.password}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 200
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 6000
      validation-timeout: 3000
